# Free Supabase projects pause after 7 days without activity.
# This pings the database every 3 days so it never goes to sleep.
name: Keep database awake

on:
  schedule:
    - cron: "17 15 */3 * *"   # every 3 days, 15:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'anonKey:\s*"\K[^"]+' config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/workouts?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
