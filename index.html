<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Pump &amp; Dump</title>
<meta name="description" content="Log lifts, timed holds and cardio. Build routines, track PRs and progress.">
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pump &amp; Dump">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: single mobile-first column (max 640px), sticky top bar, fixed bottom tab bar, rest timer docked above tabs. Hi-vis site orange on steel neutrals. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#E2E6EB; --fg:#14181D; --muted:#5A6370; --line:#D2D7DE;
  --accent:#D9480F; --accent-fg:#FFFFFF; --accent-soft:#FBE3D6; --good:#2B8A3E; --good-soft:#DDF1E1; --danger:#C92A2A;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --surface-2:#232932; --fg:#E7EAEE; --muted:#8E97A3; --line:#2C333D;
  --accent:#FF7A2E; --accent-fg:#1C0D03; --accent-soft:#3A2214; --good:#5BD26F; --good-soft:#18301E; --danger:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --surface-2:#232932; --fg:#E7EAEE; --muted:#8E97A3; --line:#2C333D;
  --accent:#FF7A2E; --accent-fg:#1C0D03; --accent-soft:#3A2214; --good:#5BD26F; --good-soft:#18301E; --danger:#FF6B6B; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
.wname{font-size:28px!important}
#plate-w{font-size:20px!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button,a,input,select,textarea,label,.srow,.ex,.card{touch-action:manipulation}
html,body{overflow-x:hidden}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 170px}
.num,.tab-num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
h3{font-size:20px;line-height:1.15}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#101318}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;flex:1}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .bt{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0;font-size:clamp(19px,5.6vw,24px)}
.brand .bt span{color:var(--accent)}
.brand .mark{width:32px;height:32px;flex:none;border-radius:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:var(--r);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--font-display);font-size:20px;margin-bottom:4px}

/* Start panel */
.start{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,transparent 10px 20px)}
.start-in{padding:16px;display:flex;flex-direction:column;gap:14px}
.routine-pick{display:flex;flex-direction:column;gap:8px}
.routine-pick button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}
.routine-pick button:hover{border-color:var(--accent)}
.routine-pick .rn{font-weight:600}
.routine-pick .rs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Active workout */
.active-head{display:flex;flex-direction:column;gap:6px}
.wname{border:0;background:transparent;font-family:var(--font-display);font-weight:700;font-size:28px;padding:0;width:100%;line-height:1.1}
.wname:focus{outline:none;border-bottom:2px solid var(--accent)}
.clock{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--accent)}
.clock .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.clock .dot{animation:none}}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px}
.ex-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.ex-head h3{flex:1;min-width:0}
.ex-head .grp{font-size:12px;color:var(--muted);margin-top:2px}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 60px 40px;gap:6px 6px;align-items:center}
.sets .h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.sets .h.l{text-align:left}
.sets .sn{font-family:var(--font-display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.sets .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.in::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.chk{width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:18px;height:18px}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.set-done .in{background:var(--good-soft);border-color:transparent}
.ex-foot{display:flex;gap:8px;margin-top:10px}
.cardio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .in{text-align:left;padding:10px}
.pace{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.pace b{color:var(--fg);font-family:var(--font-display);font-size:18px;font-weight:600}
textarea.in{text-align:left;min-height:72px;resize:vertical;padding:10px;font-weight:400}

.rest-chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 10px 6px 8px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.rest-chip svg{width:15px;height:15px;color:var(--accent)}
.rest-chip[aria-expanded="true"]{border-color:var(--accent)}
.rest-pick{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px}

/* Training extras */
.sets .sn{border:0;background:transparent;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted);position:relative;padding:0;height:36px;border-radius:8px}
.sets .sn.wu{color:var(--accent);font-size:15px;background:var(--accent-soft)}
.pr-dot{position:absolute;top:-6px;right:-4px;font-size:11px;font-style:normal}
.in.wu{opacity:.75}
.lastline{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px;font-variant-numeric:tabular-nums}
.goal{font-size:13.5px;font-weight:700;padding:7px 10px;border-radius:8px;margin-bottom:10px;background:var(--surface-2)}
.goal-weight{background:var(--accent);color:var(--accent-fg)}
.goal-rep{background:var(--good-soft);color:var(--good)}
.goal-repeat{background:var(--surface-2);color:var(--fg)}
.ex-foot{flex-wrap:wrap}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn svg{width:15px;height:15px}
.ex.ss-top{border-bottom-left-radius:0;border-bottom-right-radius:0;border-left:3px solid var(--accent)}
.ex.ss-bot{border-top-left-radius:0;border-top-right-radius:0;border-left:3px solid var(--accent)}
.ss-link{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin:-8px 0;padding:4px 12px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.ss-link svg{width:14px;height:14px}
.mob{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mob-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mob-list li span{margin-right:8px}
.mob-list li b{color:var(--muted);font-weight:600;font-size:13px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.pr-badge{color:var(--accent);font-weight:700}
.body-map{width:100%;max-width:360px;align-self:center;height:auto}
.body-map .mb{fill:var(--surface-2)}
.body-map text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.mz{stroke:var(--surface);stroke-width:1.5}
.mz.l0{fill:var(--line)}
.mz.l1{fill:var(--accent);fill-opacity:.35}
.mz.l2{fill:var(--accent);fill-opacity:.65}
.mz.l3{fill:var(--accent);fill-opacity:1}
.hm-key{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.hm-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.hm-key i.l1{background:var(--accent);opacity:.35}.hm-key i.l2{background:var(--accent);opacity:.65}.hm-key i.l3{background:var(--accent)}
.hm-list{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.hm-list b{color:var(--fg);font-variant-numeric:tabular-nums}
.plate-svg{width:100%;height:auto}
.plate-svg .bar-sleeve{fill:var(--muted)}
.plate-list{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px}
.plate-list span{display:inline-flex;align-items:center;gap:6px}
.plate-list i{display:inline-block;width:12px;height:20px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.sum-head{display:flex;align-items:center;gap:12px}
.sum-logo{width:56px;height:56px;border-radius:14px}
.pr-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.rt-it{display:flex;flex-direction:column;gap:1px}
.rt-last{font-size:12px;color:var(--muted);padding-left:2px}
.rt-edit-item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.rt-edit-item:last-child{border-bottom:0}
.rt-top{display:flex;align-items:center;gap:6px}
.rt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rt-f{display:flex;flex-direction:column;gap:4px}
.rt-f .stepper{align-self:flex-start}
.rt-chips{flex-wrap:wrap}
.step-in{width:58px;border:0;background:transparent;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);padding:0}
.step-in:focus{outline:none;background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h3{flex:1;font-size:22px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-dow{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);padding:4px 0}
.cal-day{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:8px;background:transparent;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;font-size:14px}
.cal-day.out{visibility:hidden}
.cal-day.has{background:var(--accent);color:var(--accent-fg)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal-day.has.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal-day.sel{outline:2px solid var(--accent);outline-offset:2px}
.cal-day .n2{position:absolute;bottom:2px;right:5px;font-size:9px;font-weight:700}
.cal-day:disabled{color:var(--muted);opacity:.55}
.cal-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cal-stats b{color:var(--fg);font-family:var(--font-display);font-size:18px;font-weight:700}

/* History */
.wk{display:flex;flex-direction:column;gap:10px}
.wk-head{display:flex;align-items:baseline;gap:8px}
.wk-head h3{flex:1;min-width:0}
.wk-meta{font-size:13px;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.line{display:flex;gap:10px;font-size:14px}
.line .n{flex:1;min-width:0}
.line .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.month{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .s{font-size:12px;color:var(--muted)}
.pr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.pr .v{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.pr .d{font-size:12px;color:var(--muted)}
.pr.top{border-color:var(--accent);background:var(--accent-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:10.5px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .lv{fill:var(--fg);font-weight:700;font-size:12px}
.chart .bar{fill:var(--surface-2)}
.chart .bar.now{fill:var(--accent)}
.chart .bv{fill:var(--fg);font-weight:600;font-size:11px}
select.in{text-align:left;padding:10px;appearance:auto}

/* Routines */
.rt-items{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:30px;height:32px;font-weight:700}
.stepper span{min-width:58px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.rt-controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

/* Signed-out state */
body:not(.authed) .tabs,body:not(.authed) .top .seg,body:not(.authed) .top .icon-btn{display:none}
.auth{max-width:420px;margin:24px auto 0;display:flex;flex-direction:column;gap:14px}
.auth-logo{width:88px;height:88px;border-radius:20px;align-self:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.auth h2{text-align:center;font-size:30px}
.auth .sub{text-align:center;color:var(--muted);margin-top:-6px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth .in{text-align:left;padding:12px;font-weight:500}
.auth-err{color:var(--danger);font-size:14px;font-weight:600}
.auth-ok{color:var(--good);font-size:14px;font-weight:600}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px;align-self:center}
.sync{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:4px 8px;border-radius:999px;white-space:nowrap}
.sync.off{color:var(--accent);background:var(--accent-soft)}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .live{position:absolute;top:7px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* Rest bar */
.rest{position:fixed;left:0;right:0;z-index:29;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-inline:12px}
.rest-in{max-width:616px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.rest-t{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px}
.rest-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;flex:1}
.rest-in button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px}
.rest-in button.go{background:var(--accent);color:var(--accent-fg)}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.hold .rest-in{background:var(--accent);color:var(--accent-fg)}
.hold .rest-in button.go{background:var(--fg);color:var(--bg)}
.rest.done .rest-in{background:var(--good);color:#fff}

/* Sheet */
.sheet-bg{position:fixed;inset:0;height:100dvh;background:rgba(10,12,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet-h h2{flex:1;font-size:24px}
.sheet-f{border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.sheet-err{color:var(--danger);font-size:14px;font-weight:600}
.sheet-b{overflow-y:auto;min-height:0;flex:1 1 auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px}
.ex-list{display:flex;flex-direction:column}
.ex-item{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:11px 2px}
.ex-item:hover .nm{color:var(--accent)}
.ex-item .nm{flex:1;min-width:0;font-weight:600}
.ex-item .gp{font-size:12px;color:var(--muted)}
.ex-item .last{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.set-row{display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}
.confirm span{flex:1;min-width:140px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h2{flex:1}

/* Update banner */
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:65;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
.upd button{border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:8px 14px;border-radius:999px;min-height:36px}

/* Muscle detail */
.md{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:12px;margin-top:4px}
.md-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.md-h b{font-family:var(--font-display);font-size:20px}
.md-h .muted{font-size:13px}
.md-row{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:56px;width:100%}
.md-n{font-weight:700;font-size:15px}
.md-s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.md-role{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.md-role.main{background:var(--accent-soft);color:var(--accent)}
.md-role.assist{background:var(--surface-2);color:var(--muted)}
.md-w{display:flex;flex-direction:column;align-items:flex-end;min-width:58px;font-size:11.5px;color:var(--muted)}
.md-w b{font-family:var(--font-display);font-size:22px;color:var(--fg);line-height:1}
.md-ideas{display:flex;flex-wrap:wrap;gap:6px}
.md-ideas span{background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.hm-chip{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 8px;margin:-6px -4px;border-radius:8px;min-height:34px}
.hm-chip b{color:var(--fg)}
.hm-chip.on{background:var(--surface-2);color:var(--fg)}

/* 3D body */
.hm-a{font-size:12px;color:var(--muted);font-weight:500}
.b3-stage{position:relative}
.b3-slot{width:100%;display:flex;justify-content:center}
.b3-canvas{display:block;touch-action:pan-y;cursor:grab;max-width:100%}
.b3-canvas:active{cursor:grabbing}
.b3.on .b3-fallback{display:none}
.b3:not(.on) .b3-bar .seg{display:none}
.b3-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.b3-tip{flex:1;min-width:160px;font-size:13.5px;color:var(--muted)}
.b3-tip b{color:var(--fg)}

/* Workout reordering + routine update prompt */
.ex-handle{width:30px;height:var(--tap);display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;margin-left:-6px;align-self:center}
.ex-handle svg{width:18px;height:18px}
.ro-list{display:flex;flex-direction:column;gap:8px}
.ro-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:64px;transition:box-shadow .15s}
.ro-item.dragging{background:var(--surface-2);box-shadow:0 10px 28px rgba(0,0,0,.3);border-color:var(--fg)}
.rt-update{background:var(--info-soft);border:1px solid var(--info);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rt-u-h{display:flex;align-items:center;gap:8px;color:var(--fg)}
.rt-u-h svg{width:16px;height:16px;color:var(--info);flex:none}
.rt-update ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:14px}

/* Picker: multi-select + preview */
.sheet[data-type="picker"]{min-height:min(78dvh,680px)}
.pk{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.pk .ex-item{flex:1;min-width:0;border-bottom:0;min-height:56px;gap:12px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background-color .15s,border-color .15s}
.tick svg{width:15px;height:15px}
.pk.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pk.sel .nm{color:var(--fg)}
.info-btn{width:36px;height:36px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-family:Georgia,serif;font-style:italic}
.info-btn[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exinfo{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px;margin:6px 0 10px}
.body-mini{width:118px;flex:none;height:auto}
.body-mini .mb{fill:var(--surface-2)}.body-mini text{display:none}
.ei-txt{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px}
.ei-txt .label{margin-right:4px}
.ei-cue{margin:0;line-height:1.45}
.ei-note{margin:0;display:flex;gap:6px;color:var(--muted);font-size:13px}.ei-note svg{width:14px;height:14px;flex:none;margin-top:2px}
.btn.demo{align-self:flex-start;text-decoration:none;color:var(--fg)}
.btn.demo svg{width:14px;height:14px}
.btn:disabled{opacity:.55;cursor:default}
/* Drag to reorder */
.rt-handle{width:36px;height:var(--tap);display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;margin-left:-8px}
.rt-handle svg{width:18px;height:18px}
.rt-edit-item.dragging{background:var(--surface-2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:0 -10px;padding-inline:10px}

/* Exercise notes + edit mode */
.xnote{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;border:0;background:var(--surface-2);color:var(--fg);border-radius:10px;padding:9px 11px;margin:0 0 10px;font-size:14px;line-height:1.35;min-height:40px}
.xnote svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--muted)}
.xnote span{white-space:pre-wrap;overflow-wrap:anywhere}
.note-ed{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.note-ed textarea{min-height:64px}
.edit-banner{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--info-soft);color:var(--info);font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px}
.edit-banner svg{width:14px;height:14px}
.edit-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-meta .in{text-align:left;padding:10px}

/* ===================== Redesign v12 ===================== */
/* Colour roles: orange = primary action + live states only; gold = records; green = done; blue = supersets. */
:root{--gold:#A86B00;--gold-soft:#FFF1D1;--info:#1C6ED6;--info-soft:#E1EDFC;--row-done:#E3F4E6;--tap:44px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#F5B83D;--gold-soft:#3A2D10;--info:#6AB0FF;--info-soft:#16263A;--row-done:#16291B}}
:root[data-theme="dark"]{--gold:#F5B83D;--gold-soft:#3A2D10;--info:#6AB0FF;--info-soft:#16263A;--row-done:#16291B}

/* Sentence-case labels: less shouting */
.label,.sets .h,.month,.sync,.tag{text-transform:none;letter-spacing:0}
.label{font-size:12.5px;font-weight:600}
.month{font-size:16px;letter-spacing:.01em}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px}
.tag.acc{background:var(--surface-2);color:var(--fg)}

/* Tap targets (44px) */
.icon-btn{width:var(--tap);height:var(--tap);border-radius:10px}
.btn.sm{min-height:40px;padding:8px 12px}
.chip{min-height:38px;padding:8px 14px}
.stepper{border-radius:10px}
.stepper button{width:var(--tap);height:var(--tap);font-size:18px}
.stepper span{min-width:64px;font-size:14px}
.step-in{height:var(--tap)}
.seg button{min-height:34px;padding:6px 12px}
.rest-chip{min-height:38px;padding:7px 11px 7px 9px}
.rest-chip svg{color:var(--muted)}
.rest-chip[aria-expanded="true"]{border-color:var(--fg)}
.icon-btn.more{color:var(--muted)}
.icon-btn.more[aria-expanded="true"]{background:var(--surface-2);color:var(--fg)}
.icon-btn.danger-i{color:var(--danger)}
.icon-btn:disabled{opacity:.3}

/* Exercise card: calm header, one info line */
.ex{padding:14px 12px 12px}
.ex-head{align-items:center;margin-bottom:6px}
.ex-head h3{font-size:21px}
.info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--muted);margin:0 2px 8px;font-variant-numeric:tabular-nums}
.info .g{font-weight:700}
.g-rep{color:var(--good)}
.g-weight{color:var(--gold)}
.g-repeat,.g-first{color:var(--fg)}
.menu{display:flex;flex-direction:column;background:var(--bg);border-radius:12px;padding:4px;margin:2px 0 10px}
.mi{border:0;background:transparent;text-align:left;padding:12px 12px;min-height:var(--tap);border-radius:8px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.mi span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.mi:hover{background:var(--surface-2)}
.mi.danger{color:var(--danger)}
.mi-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.mi-confirm span{flex:1;min-width:120px;font-weight:600}

/* Set rows: a log, not a spreadsheet */
.sets{display:block}
.shead,.srow{display:grid;grid-template-columns:36px minmax(0,1fr) 78px 66px 50px;gap:4px;align-items:center}
.shead{padding:0 4px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.shead span{text-align:center}.shead .l{text-align:left}
.swipe{position:relative;border-radius:10px;overflow:hidden;margin-bottom:4px}
.sdel{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--danger);color:#fff;font-weight:700;visibility:hidden}
.swipe.dragging .sdel{visibility:visible}
.srow{position:relative;background:var(--surface);min-height:52px;padding:2px 4px;border-radius:10px;transition:transform .22s ease,background-color .2s}
.srow.done{background:var(--row-done)}
.srow.wu .cell,.srow.wu .prev{color:var(--muted)}
.srow.wu .cell{font-weight:600}
.srow .sn{border:0;background:transparent;height:var(--tap);font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--muted);position:relative;border-radius:8px;padding:0}
.srow.done .sn{color:var(--good)}
.srow .sn.wu,.srow.wu .sn{color:var(--muted);font-size:16px;background:var(--surface-2)}
.srow .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cell{width:100%;min-width:0;height:var(--tap);border:0;background:transparent;border-radius:8px;text-align:center;font-weight:700;font-size:19px!important;font-variant-numeric:tabular-nums;padding:0 4px;color:var(--fg)}
.cell::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.cell:focus{outline:none;background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--fg)}
.srow.done .cell{color:var(--fg)}
.chk{width:46px;height:var(--tap);border-radius:10px;border:1.5px solid var(--line);background:transparent;justify-self:end}
.chk svg{width:20px;height:20px}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.chk.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.pr-dot{position:absolute;top:6px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.ex-foot{margin-top:8px}
.add-set{flex:1;background:transparent;border-style:dashed}

/* Supersets in blue */
.ex.ss-top,.ex.ss-bot{border-left:3px solid var(--info)}
.ss-link{color:var(--info);background:var(--info-soft);border-left-color:var(--info)}
.btn.on{border-color:var(--info);color:var(--info)}

/* Records in gold */
.pr-box{background:var(--gold-soft);border-color:var(--gold)}
.pr-badge{color:var(--gold)}
.goal-weight{background:var(--gold);color:#1a1205}
.pr-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pr-v{font-weight:700}

/* Calendar: trained days in green */
.cal-day.has{background:var(--good);color:var(--surface)}

/* Tabs: neutral active state */
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button svg{padding:3px 14px;border-radius:999px;box-sizing:content-box;transition:background-color .2s}
.tabs button[aria-current="page"] svg{background:var(--surface-2)}
.tabs button{padding-top:7px}
.tabs .live{background:var(--accent);top:5px}

/* Home */
.hero .start-in{gap:10px;padding:18px 16px}
.hero-t{font-size:38px;line-height:1}
.hero-x{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn.big{min-height:54px;font-size:17px;margin-top:6px}

/* Routine editor: one line per exercise, expand to edit */
.rt-top{gap:2px}
.rt-sum{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:6px 0;display:flex;flex-direction:column;gap:2px;min-height:var(--tap)}
.rt-n{font-weight:700;font-size:16px}
.rt-s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt-edit-item.open{background:var(--bg);margin:0 -10px;padding:12px 10px;border-radius:12px;border-bottom-color:transparent}
.rt-body{display:flex;flex-direction:column;gap:10px;padding-top:6px}

/* Rest timer: ring */
.rest-in{padding:8px 10px}
.rest-open{border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0;text-align:left}
.rest-in button{min-height:40px}
.rest-open{min-height:44px}
.ring .ring-bg{fill:none;stroke:rgba(127,127,127,.28)}
.ring .ring-fg{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .25s linear}
.ring.sm{width:38px;height:38px;flex:none}.ring.sm circle{stroke-width:5}
.ring.lg circle{stroke-width:12}
.rest .rest-t{font-size:26px;min-width:0}
.rest .rest-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;opacity:.75}
.rest.done .ring-fg{stroke:#fff}
.rest-full{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.rf-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
.rf-l{font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.rf-ring{position:relative;width:min(78vw,280px);aspect-ratio:1}
.rf-ring .ring{width:100%;height:100%}
.rf-t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:clamp(64px,22vw,96px);font-variant-numeric:tabular-nums}
.rf-btns{display:flex;gap:12px;width:100%}
.rf-btns button{flex:1;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:16px}
.rest-full.done .ring-fg{stroke:var(--good)}
.rest-full.done .rf-l{color:var(--good)}

/* PR moment: hazard-stripe sweep */
.pr-sweep{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center;overflow:hidden;contain:paint}
.ps-band{position:absolute;left:-20%;right:-20%;top:50%;height:150px;margin-top:-75px;background:repeating-linear-gradient(-45deg,var(--gold) 0 26px,#111 26px 52px);transform:translateX(-120%) skewY(-6deg);animation:band 1s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ps-card{position:relative;background:#111;color:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px 22px;text-align:center;transform:scale(.6);opacity:0;animation:card .45s .35s cubic-bezier(.2,1.4,.4,1) forwards;max-width:86vw}
.ps-k{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);line-height:1}
.ps-n{font-weight:700;margin-top:4px}
.ps-t{font-size:14px;color:#d8dde3;font-variant-numeric:tabular-nums}
.pr-sweep.out{transition:opacity .45s;opacity:0}
@keyframes band{to{transform:translateX(0) skewY(-6deg)}}
@keyframes card{to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ps-band,.ps-card{animation:none;transform:none;opacity:1}.chk.pop{animation:none}.srow{transition:none}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232A33"/><stop offset="1" stop-color="#101318"/></linearGradient>
    <pattern id="mtape" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="96" height="96" fill="#101318"/><rect width="48" height="96" fill="#FF6A1A"/></pattern>
    <clipPath id="msq"><rect width="1024" height="1024" rx="230"/></clipPath>

    if(def&&def.indoor)parts.push(c.mode==="outdoor"?"Outdoors":def.indoor);

  if(isTimed(e)){const ts=(e.sets||[]).filter(s=>s.t&&!s.wu);if(!ts.length)return "";const long=ts.reduce((b,x)=>x.t>b.t?x:b);const hw=Math.max(0,...ts.map(x=>x.w||0));

function calendar(ws){const now=new Date();if(!S.calMonth)S.calMonth=now.getFullYear()+"-"+now.getMonth();
  const [y,mo]=S.calMonth.split("-").map(Number);const first=new Date(y,mo,1);const days=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7;const counts={};
  ws.forEach(w=>{const d=new Date(w.date);if(d.getFullYear()===y&&d.getMonth()===mo)counts[d.getDate()]=(counts[d.getDate()]||0)+1});
  const active=Object.keys(counts).length;const total=Object.values(counts).reduce((a,b)=>a+b,0);
  // current streak in weeks with at least one workout
  let streak=0;{const wk=new Set(ws.map(w=>weekStart(w.date).getTime()));let c=weekStart(now);if(!wk.has(c.getTime()))c.setDate(c.getDate()-7);while(wk.has(c.getTime())){streak++;c.setDate(c.getDate()-7)}}
  const isNow=y===now.getFullYear()&&mo===now.getMonth();const future=new Date(y,mo+1,1)>now;
  let cells=["M","T","W","T","F","S","S"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<lead;i++)cells+=`<div class="cal-day out"></div>`;
  for(let d=1;d<=days;d++){const n=counts[d]||0;const key=y+"-"+(mo+1)+"-"+d;const today=isNow&&d===now.getDate();
    cells+=`<button class="cal-day${n?" has":""}${today?" today":""}${S.calDay===key?" sel":""}" ${n?`data-act="cal-day" data-v="${key}"`:"disabled"} aria-label="${new Date(y,mo,d).toLocaleDateString(undefined,{month:"long",day:"numeric"})}${n?`, ${n} workout${n>1?"s":""}`:""}">${d}${n>1?`<span class="n2">×${n}</span>`:""}</button>`}
  return `<div class="card stack" style="gap:10px"><div class="cal-head"><button class="icon-btn" data-act="cal-nav" data-v="-1" aria-label="Previous month">‹</button><h3>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h3><button class="icon-btn" data-act="cal-nav" data-v="1" aria-label="Next month" ${future?"disabled":""}>›</button></div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-stats"><span><b>${active}</b> days trained</span><span><b>${total}</b> workout${total===1?"":"s"}</span><span><b>${streak}</b> week streak</span></div></div>`}
function renderHistory(){let ws=sortedWorkouts();
  if(!ws.length)return `<h2>History</h2>${calendar(ws)}<div class="empty"><strong>No workouts saved yet</strong>Finish a workout in the Log tab and it will appear here with every set and run.</div>`;
  let out=`<div class="sec-h"><h2>History</h2><span class="muted">${ws.length} workout${ws.length===1?"":"s"}</span></div>`+calendar(ws);let lastMonth="";
  const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
  if(S.calDay){const sel=ws.filter(w=>dayKey(w.date)===S.calDay);
    out+=`<div class="row"><span class="label grow">${fmtDay(sel[0]?sel[0].date:Date.now())}</span><button class="btn sm ghost" data-act="cal-clear">Show all workouts</button></div>`;

  ws.slice(0,S.histLimit).forEach(w=>{const m=new Date(w.date).toLocaleDateString(undefined,{month:"long",year:"numeric"});

      <div class="lines">${(w.entries||[]).map(e=>`<div class="line"><span class="n">${esc(e.name)}</span><span class="v">${esc(entrySummary(e))}</span></div>`).join("")}</div>

       :`<div class="row" style="flex-wrap:wrap"><button class="btn sm" data-act="edit-w" data-id="${w.id}">Edit</button><button class="btn sm" data-act="repeat" data-id="${w.id}">Repeat</button><button class="btn sm" data-act="summary" data-id="${w.id}">Share</button><button class="btn sm" data-act="save-as-r" data-id="${w.id}">Save as routine</button><span class="grow"></span><button class="btn sm ghost danger" data-act="ask" data-v="del-${w.id}">Delete</button></div>`}
    </article>`});
  if(ws.length>S.histLimit)out+=`<button class="btn block" data-act="more">Show older workouts</button>`;
  return out}

function progressData(){const map={};
  sortedWorkouts().slice().reverse().forEach(w=>(w.entries||[]).forEach(e=>{
    const k=e.exId;if(!map[k])map[k]={id:k,name:e.name,kind:e.kind,sessions:[]};
    if(e.kind==="cardio"){const c=e.cardio||{};map[k].sessions.push({date:w.date,dist:c.dist||0,time:c.time||0,pace:c.dist&&c.time?c.time/c.dist:0,incline:c.incline,mode:c.mode})}
    else if(isTimed(e)){let lt=0,hw=0,hwT=0;(e.sets||[]).forEach(s=>{if(!s.t||s.wu)return;if(s.t>lt)lt=s.t;const w2=s.w||0;if(w2>hw||(w2===hw&&s.t>hwT)){hw=w2;hwT=s.t}});map[k].timed=true;map[k].sessions.push({date:w.date,hold:lt,top:hw,topT:hwT})}
    else{let top=0,best=0,vol=0,reps=0,topR=0,bestSet=null;(e.sets||[]).forEach(s=>{if(!s.r||s.wu)return;const w2=s.w||0;if(w2>top||(w2===top&&s.r>topR)){top=w2;topR=s.r}const er=e1rm(w2,s.r);if(er>best){best=er;bestSet=s}vol+=w2*s.r;reps=Math.max(reps,s.r)});
      map[k].sessions.push({date:w.date,top,topR,e1rm:best,vol,reps,bestSet})}}));
  return Object.values(map).sort((a,b)=>b.sessions.length-a.sessions.length)}
function renderProgress(){const data=progressData();
  const head=`<h2>Progress</h2>${heatMap()}${weeklyChart()}`;
  if(!data.length)return head+`<div class="empty"><strong>Charts appear after your first workout</strong>Each exercise you log gets its own chart and personal records.</div>`;
  if(!S.progEx||!data.find(d=>d.id===S.progEx))S.progEx=data[0].id;
  const d=data.find(x=>x.id===S.progEx);
  const bw=d.kind==="lift"&&!d.timed&&d.sessions.every(s=>!s.top);
  const metrics=d.timed?(d.sessions.some(s=>s.top)?[["hold","Longest hold"],["top","Top weight"]]:[["hold","Longest hold"]]):d.kind==="cardio"?[["dist","Distance"],["pace","Pace"],["time","Time"]]:bw?[["reps","Best reps"]]:[["e1rm","Est. 1RM"],["top","Top weight"],["vol","Volume"],["reps","Best reps"]];
  if(!metrics.find(m=>m[0]===S.progMetric))S.progMetric=metrics[0][0];
  const m=S.progMetric;
  const pts=d.sessions.filter(s=>m==="hold"?s.hold:m==="pace"?s.pace:m==="dist"?s.dist:m==="time"?s.time:m==="reps"?s.reps:s[m]).map(s=>{
    let y=s[m];if(["e1rm","top","vol"].includes(m))y=S.unit==="lb"?y/LB:y;if(m==="dist")y=S.dist==="mi"?y/MI:y;if(m==="pace")y=S.dist==="mi"?y*MI:y;return {x:new Date(s.date).getTime(),y}});
  const fmt=m==="pace"||m==="time"||m==="hold"?v=>clock(v):m==="vol"?v=>compact(v):v=>trim1(v);
  const unitLbl={e1rm:S.unit,top:S.unit,vol:S.unit+" × reps",reps:"reps",dist:S.dist,pace:"min/"+S.dist,time:"h:mm:ss",hold:"m:ss"}[m];
  return head+`<div class="field"><label class="label" for="prog-ex">Exercise</label><select class="in" id="prog-ex" data-f="progex">${data.map(x=>`<option value="${x.id}" ${x.id===d.id?"selected":""}>${esc(x.name)} (${x.sessions.length})</option>`).join("")}</select></div>
   <div class="chips" role="group" aria-label="Metric">${metrics.map(([k,l])=>`<button class="chip" data-act="metric" data-v="${k}" aria-pressed="${k===m}">${l}</button>`).join("")}</div>
   <div class="card"><div class="row" style="margin-bottom:6px"><span class="label grow">${esc(d.name)}</span><span class="label">${unitLbl}</span></div>
   ${pts.length?lineChart(pts,fmt,m==="pace"):'<div class="muted">No data for this metric yet.</div>'}</div>
   ${prCards(d,bw)}${recentTable(d)}`}
function prCards(d,bw){const ss=d.sessions;const max=(f)=>ss.reduce((b,s)=>f(s)>(b?f(b):-Infinity)?s:b,null);
  if(d.kind==="cardio"){const far=max(s=>s.dist),fast=ss.filter(s=>s.pace).reduce((b,s)=>!b||s.pace<b.pace?s:b,null),long=max(s=>s.time);
    return `<div class="label">Personal records</div><div class="pr-grid">
     <div class="pr top"><div class="label">Longest distance</div><div class="v">${far&&far.dist?fmtD(far.dist):"–"}</div><div class="d">${far&&far.dist?fmtShort(far.date):""}</div></div>
     <div class="pr"><div class="label">Fastest pace</div><div class="v">${fast?paceStr(1,fast.pace):"–"}</div><div class="d">${fast?fmtShort(fast.date):""}</div></div>
     <div class="pr"><div class="label">Longest session</div><div class="v">${long&&long.time?clock(long.time):"–"}</div><div class="d">${long&&long.time?fmtShort(long.date):""}</div></div>
     <div class="pr"><div class="label">Sessions</div><div class="v">${ss.length}</div><div class="d">since ${fmtShort(ss[0].date)}</div></div></div>`}
  if(d.timed){const h=max(s=>s.hold),hv=ss.some(s=>s.top)?max(s=>s.top*1e5+s.topT):null;
    return `<div class="label">Personal records</div><div class="pr-grid">
     <div class="pr top"><div class="label">Longest hold</div><div class="v">${clock(h.hold)}</div><div class="d">${fmtShort(h.date)}</div></div>
     <div class="pr"><div class="label">Heaviest hold</div><div class="v">${hv?fmtW(hv.top)+" · "+clock(hv.topT):"–"}</div><div class="d">${hv?fmtShort(hv.date):"Add weight to track this"}</div></div>
     <div class="pr"><div class="label">Sessions</div><div class="v">${ss.length}</div><div class="d">since ${fmtShort(ss[0].date)}</div></div></div>`}
  if(bw){const r=max(s=>s.reps);return `<div class="label">Personal records</div><div class="pr-grid"><div class="pr top"><div class="label">Most reps in a set</div><div class="v">${r.reps}</div><div class="d">${fmtShort(r.date)}</div></div><div class="pr"><div class="label">Sessions</div><div class="v">${ss.length}</div><div class="d">since ${fmtShort(ss[0].date)}</div></div></div>`}
  const top=max(s=>s.top*1000+s.topR),er=max(s=>s.e1rm),vol=max(s=>s.vol);
  return `<div class="label">Personal records</div><div class="pr-grid">
   <div class="pr top"><div class="label">Heaviest set</div><div class="v">${fmtW(top.top)} × ${top.topR}</div><div class="d">${fmtShort(top.date)}</div></div>
   <div class="pr"><div class="label">Best est. 1RM</div><div class="v">${fmtW(er.e1rm)}</div><div class="d">${fmtShort(er.date)} · Epley</div></div>
   <div class="pr"><div class="label">Best session volume</div><div class="v">${compact(S.unit==="lb"?vol.vol/LB:vol.vol)} ${S.unit}</div><div class="d">${fmtShort(vol.date)}</div></div>
   <div class="pr"><div class="label">Sessions</div><div class="v">${ss.length}</div><div class="d">since ${fmtShort(ss[0].date)}</div></div></div>`}
function recentTable(d){const rows=sortedWorkouts().map(w=>({w,e:(w.entries||[]).find(e=>e.exId===d.id)})).filter(x=>x.e).slice(0,6);
  return `<div class="label">Recent sessions</div><div class="card lines" style="border-top:1px solid var(--line)">${rows.map(x=>`<div class="line"><span class="n">${fmtShort(x.w.date)}</span><span class="v">${esc(entrySummary(x.e))}</span></div>`).join("")}</div>`}

function niceTicks(lo,hi,n){const span=hi-lo||1;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/mag;const step=(f>=7.5?10:f>=3.5?5:f>=1.5?2:1)*mag;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);return t}
function lineChart(pts,fmt,invert){const W=340,H=180,Lp=46,Rp=14,T=18,B=24;
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  let ymin=Math.min(...pts.map(p=>p.y)),ymax=Math.max(...pts.map(p=>p.y));const pad=(ymax-ymin)*0.15||Math.abs(ymax)*0.1||1;
  let lo=ymin-pad,hi=ymax+pad;if(ymin>=0&&lo<0)lo=0;
  if(invert){/* pace: smaller is better, plot as-is but flip axis so faster is higher */}
  const tk=niceTicks(lo,hi,4);lo=tk[0];hi=tk[tk.length-1];
  const sx=x=>Lp+(x-x0)/(x1-x0)*(W-Lp-Rp);const sy=y=>{const f=(y-lo)/(hi-lo);return T+(invert?f:1-f)*(H-T-B)};
  let g=tk.map(t=>`<line class="gl" x1="${Lp}" x2="${W-Rp}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${Lp-6}" y="${sy(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  const P=pts.map(p=>[sx(p.x),sy(p.y)]);const line=P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const base=invert?T:H-B;const area=pts.length>1?`<path class="ar" d="${line} L${P[P.length-1][0].toFixed(1)} ${base} L${P[0][0].toFixed(1)} ${base} Z"/>`:"";
  const dots=P.map((p,i)=>`<circle class="pt${i===P.length-1?" last":""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===P.length-1?4.5:3}"/>`).join("");
  const lp=P[P.length-1];const lyAbove=lp[1]-10>T+2;const lbl=`<text class="lv" x="${Math.min(lp[0],W-Rp)}" y="${lyAbove?lp[1]-10:lp[1]+18}" text-anchor="${lp[0]>W-60?"end":"middle"}">${fmt(pts[pts.length-1].y)}</text>`;
  const xl=`<text x="${Lp}" y="${H-6}" text-anchor="start">${fmtShort(pts[0].x)}</text>${pts.length>1?`<text x="${W-Rp}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].x)}</text>`:""}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${pts.length} sessions">${g}${area}<path class="ln" d="${line}"/>${dots}${lbl}${xl}</svg>`}
function weeklyChart(){const now=weekStart(new Date());const weeks=[];for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-7*i);weeks.push({d,n:0})}
  S.workouts.forEach(w=>{const ws=weekStart(w.date).getTime();const b=weeks.find(x=>x.d.getTime()===ws);if(b)b.n++});
  const W=340,H=130,T=18,B=22,gap=8,bw=(W-gap*7)/8,max=Math.max(3,...weeks.map(w=>w.n));
  const bars=weeks.map((w,i)=>{const h=w.n/max*(H-T-B);const x=i*(bw+gap);const y=H-B-h;
    return `<rect class="bar${i===7?" now":""}" x="${x.toFixed(1)}" y="${(w.n?y:H-B-2).toFixed(1)}" width="${bw.toFixed(1)}" height="${(w.n?h:2).toFixed(1)}" rx="3"/>${w.n?`<text class="bv" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${w.n}</text>`:""}<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i===7?"This wk":fmtShort(w.d)}</text>`}).join("");
  return `<div class="card"><div class="label" style="margin-bottom:6px">Workouts per week</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Workouts per week, last 8 weeks">${bars}</svg></div>`}

function renderSheet(){const el=$("#sheet");const sh=S.sheet;if(!sh){el.innerHTML="";el.dataset.type="";return}

  let title="",body="",foot="";
  if(sh.type==="picker"){title=/^swap/.test(sh.target)?"Swap exercise":"Add exercises";body=pickerBody(sh);foot=pickerFoot(sh)}
  else if(sh.type==="exinfo"){const ex=exById(sh.id);title=ex?ex.name:"Exercise";body=ex?exInfo(ex):""}
  else if(sh.type==="routine"){const d=S.routineDraft;title=d.isNew?"New routine":"Edit routine";body=routineBody(d);foot=routineFoot(d)}
  else if(sh.type==="settings"){title="Settings";body=settingsBody()}
  else if(sh.type==="plates"){title="Plate calculator";body=platesBody()}
  else if(sh.type==="summary"){const w=S.workouts.find(x=>x.id===sh.id);if(!w){S.sheet=null;el.innerHTML="";return}title="Workout complete";body=summaryBody(w)}
  const sb=$("#sheet-b");
  if(sb&&el.dataset.type===key){ // same panel: update contents in place so the scroll position is untouched
    const top=sb.scrollTop;const h=el.querySelector(".sheet-h h2");if(h)h.textContent=title;
    sb.innerHTML=body;const f=$("#sheet-foot");if(f)f.innerHTML=foot;
    if(sb.scrollTop!==top)sb.scrollTop=top;requestAnimationFrame(()=>{if(Math.abs(sb.scrollTop-top)>1)sb.scrollTop=top});return}
  el.innerHTML=`<div class="sheet-bg" data-act="close-sheet-bg"><div class="sheet" data-type="${sh.type}" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-h"><h2>${title}</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.x}</button></div><div class="sheet-b" id="sheet-b">${body}</div><div id="sheet-foot">${foot}</div></div></div>`;el.dataset.type=key;
  if(sh.type==="routine"&&S.rtReturn!=null){const nb=$("#sheet-b");const v=S.rtReturn;S.rtReturn=null;if(nb)nb.scrollTop=v==="bottom"?nb.scrollHeight:v}}

function routineBody(d){const last=d.items.length-1;

     ${S.rtInfo===i&&exById(it.exId)?exInfo(exById(it.exId)):""}</div></div>`}).join(""):'<div class="muted">No exercises yet.</div>'}</div>
   ${d.items.length>1?`<div class="muted" style="font-size:13px">Drag ${ICON.grip.replace('<svg','<svg width="12" height="12" style="vertical-align:-1px"')} to reorder. Tap an exercise to edit it.</div>`:""}

  S.lastBackup=new Date().toISOString();saveProfile();
  try{const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Pump & Dump backup"});renderSheet();return}}catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);renderSheet();toast("Backup saved")}
function importText(text){let o;try{o=JSON.parse(text.trim())}catch(e){toast("That isn't a valid backup. Copy the whole text and try again.");return}
  const ws=Array.isArray(o.workouts)?o.workouts:[];const p=o.profile||{};let added=0;
  ws.forEach(w=>{if(!w||!w.id||!w.date)return;w=JSON.parse(JSON.stringify(w));if(!S.workouts.some(x=>x.id===w.id))added++;
    S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(w);delete outbox.del[w.id];outbox.up[w.id]=w});
  (p.customEx||[]).forEach(e=>{if(e&&e.id&&!S.customEx.some(x=>x.id===e.id))S.customEx.push(JSON.parse(JSON.stringify(e)))});
  let rAdded=0;(p.routines||[]).forEach(r=>{if(r&&r.id&&!S.routines.some(x=>x.id===r.id)){S.routines.push(JSON.parse(JSON.stringify(r)));rAdded++}});
  S.importOpen=false;saveProfile(true);render();toast(`Imported ${added} workout${added===1?"":"s"} and ${rAdded} routine${rAdded===1?"":"s"}`)}

/* ---------- Drag to reorder exercises during a workout ---------- */
let wdrag=null;
document.addEventListener("pointerdown",ev=>{const h=ev.target.closest(".ex-handle[data-ei]");if(!h||!S.active)return;ev.preventDefault();
  const i=+h.dataset.ei;wdrag={i,y:ev.clientY};S.reorder={i};S.menu=null;S.restPick=null;render();
  const el=document.querySelector(`.ro-item[data-i="${i}"]`);if(el){const b=el.getBoundingClientRect();window.scrollBy(0,b.top+b.height/2-ev.clientY)}
  try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}});
document.addEventListener("pointermove",ev=>{if(!wdrag)return;ev.preventDefault();wdrag.y=ev.clientY;
  if(ev.clientY<110)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-150)window.scrollBy(0,14);
  const items=[...document.querySelectorAll("#view .ro-item")];const a=S.active;
  for(let k=0;k<items.length;k++){if(k===wdrag.i)continue;const bx=items[k].getBoundingClientRect();const mid=bx.top+bx.height/2;
    if((k<wdrag.i&&ev.clientY<mid)||(k>wdrag.i&&ev.clientY>mid)){const [m]=a.entries.splice(wdrag.i,1);a.entries.splice(k,0,m);wdrag.i=k;S.reorder={i:k};render();break}}},{passive:false});
const endWDrag=()=>{if(!wdrag)return;const {i,y}=wdrag;wdrag=null;S.reorder=null;saveProfile();render();
  const card=document.querySelectorAll("#view section.ex")[i];if(card){const b=card.getBoundingClientRect();window.scrollBy(0,b.top-Math.max(90,y-40))}};
document.addEventListener("pointerup",endWDrag);document.addEventListener("pointercancel",endWDrag);

/* ---------- Drag to reorder routine exercises ---------- */
let drag=null;
document.addEventListener("pointerdown",ev=>{const h=ev.target.closest(".rt-handle");if(!h)return;ev.preventDefault();drag={i:+h.dataset.i};S.rtDrag=drag.i;S.rtOpen=-1;S.rtInfo=-1;renderSheet();
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}});
document.addEventListener("pointermove",ev=>{if(!drag)return;ev.preventDefault();const sb=$("#sheet-b");if(!sb)return;const r=sb.getBoundingClientRect();
  if(ev.clientY<r.top+56)sb.scrollTop-=14;else if(ev.clientY>r.bottom-56)sb.scrollTop+=14;
  const items=[...sb.querySelectorAll(".rt-edit-item")];
  for(let k=0;k<items.length;k++){if(k===drag.i)continue;const bx=items[k].getBoundingClientRect();const mid=bx.top+bx.height/2;
    if((k<drag.i&&ev.clientY<mid)||(k>drag.i&&ev.clientY>mid)){const arr=S.routineDraft.items;const [m]=arr.splice(drag.i,1);arr.splice(k,0,m);drag.i=k;S.rtDrag=k;renderSheet();break}}},{passive:false});
const endDrag=()=>{if(!drag)return;drag=null;S.rtDrag=null;renderSheet()};
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);

/* ---------- Swipe a set row left to delete ---------- */
let sw=null;
function closeSwipes(except){document.querySelectorAll(".srow.open").forEach(x=>{if(x!==except){x.classList.remove("open");x.style.transform="";setTimeout(()=>x.parentElement&&x.parentElement.classList.remove("dragging"),230)}})}
document.addEventListener("touchstart",ev=>{const r=ev.target.closest(".srow");closeSwipes(r);if(!r)return;const t=ev.touches[0];sw={r,x:t.clientX,y:t.clientY,dx:0,lock:null,base:r.classList.contains("open")?-96:0}},{passive:true});
document.addEventListener("touchmove",ev=>{if(!sw)return;const t=ev.touches[0];const dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(sw.lock==null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.lock=Math.abs(dx)>Math.abs(dy)*1.2?"x":"y";if(sw.lock!=="x")return;
  sw.dx=Math.max(-130,Math.min(0,sw.base+dx));sw.r.parentElement.classList.add("dragging");sw.r.style.transition="none";sw.r.style.transform=`translateX(${sw.dx}px)`},{passive:true});
document.addEventListener("touchend",()=>{if(!sw)return;const r=sw.r;r.style.transition="";if(sw.lock==="x"){const open=sw.dx<-48;r.classList.toggle("open",open);r.style.transform=open?"translateX(-96px)":"";if(!open)setTimeout(()=>{if(!r.classList.contains("open"))r.parentElement.classList.remove("dragging")},230)}sw=null});

let toastT=null;function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2600)}

boot();
(function(){const vm=document.querySelector('meta[name="viewport"]');if(!vm||!window.visualViewport)return;const base=vm.getAttribute("content");
  const reset=()=>{if(visualViewport.scale<=1.01)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
    vm.setAttribute("content",base.replace("initial-scale=1","initial-scale=1.0001"));setTimeout(()=>vm.setAttribute("content",base),60)};
  document.addEventListener("focusout",()=>setTimeout(reset,250));window.addEventListener("orientationchange",()=>setTimeout(reset,400));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(reset,200)});visualViewport.addEventListener("resize",()=>{clearTimeout(reset.t);reset.t=setTimeout(reset,900)})})();
if("serviceWorker" in navigator&&location.protocol==="https:"){
  const hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const check=()=>{try{reg.update()}catch(e){}};
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});setInterval(check,30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadSW)return;const u=document.getElementById("upd");if(u)u.hidden=false});
}
})();
</script>
</body>
</html>
