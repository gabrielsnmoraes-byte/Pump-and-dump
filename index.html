/* ---------- Events ---------- */
function liveClock(){const a=S.active;const el=$("#clock");if(a&&el)el.textContent=clock((Date.now()-a.startedAt)/1000)}
function tickClock(){liveClock()}
setInterval(liveClock,1000);

document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,v=b.dataset.v;const a=S.active;
  const ei=b.dataset.ei!=null?+b.dataset.ei:null,si=b.dataset.si!=null?+b.dataset.si:null;
  switch(act){
  case "auth-mode":S.auth={mode:v,email:S.auth&&S.auth.email,err:null,msg:null};renderAuth();break;
  case "ask-signout":S.confirm="signout";renderSheet();break;
  case "cancel-confirm-sheet":S.confirm=null;renderSheet();break;
  case "signout":S.confirm=null;signOut();break;
  case "export":exportBackup();break;
  case "import-open":S.importOpen=!S.importOpen;renderSheet();break;
  case "import-go":importText(($("#imp-text")||{}).value||"");break;
  case "tab":S.tab=v;S.confirm=null;render();window.scrollTo(0,0);break;
  case "unit":S.unit=v;saveProfile();render();break;
  case "dist":S.dist=v;saveProfile();render();break;
  case "settings":S.sheet={type:"settings"};renderSheet();break;
  case "rest-def":S.rest=+v;saveProfile();render();break;
  case "sound":S.sound=v==="1";if(S.sound)unlockAudio();saveProfile();renderSheet();break;
  case "close-sheet":S.sheet=S.sheet&&S.sheet.type==="picker"&&S.sheet.target==="routine"?{type:"routine"}:null;renderSheet();break;
  case "close-sheet-bg":if(ev.target===b){S.sheet=S.sheet&&S.sheet.type==="picker"&&S.sheet.target==="routine"?{type:"routine"}:null;renderSheet()}break;
  case "start-empty":unlockAudio();startWorkout(null,[]);break;
  case "start-routine":{unlockAudio();const r=S.routines.find(x=>x.id===b.dataset.id);if(!r)break;
    if(S.active&&S.tab!=="log"){S.tab="log";render();toast("Finish or discard the current workout first.");break}
    startWorkout(r.name,r.items.map(it=>{const ex=exById(it.exId)||{id:it.exId,name:it.name,kind:it.kind,group:"",timed:!!it.timed};let pf;
      if(it.kind==="cardio")pf={rid:r.id};else if(isTimed(it))pf={sets:it.sets,reps:it.reps,rid:r.id};
      else pf={sets:it.sets,prog:{min:it.repMin??it.reps??8,max:it.repMax??it.reps??12,inc:it.inc||defaultIncKg()},warmup:!!it.warmup,rid:r.id};
      const ne=newEntry(ex,pf);if(it.rest&&it.kind!=="cardio")ne.rest=it.rest;if(it.ss)ne.ss=true;return ne}),r.id);break}
  case "repeat":{const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)break;if(S.active){S.tab="log";render();toast("Finish or discard the current workout first.");break}
    startWorkout(w.name,(w.entries||[]).map(e=>{const ex=exById(e.exId)||{id:e.exId,name:e.name,kind:e.kind};
      if(e.kind==="cardio")return newEntry(ex,{cardio:{mode:e.cardio&&e.cardio.mode,incline:e.cardio&&e.cardio.incline}});
      const n=newEntry(ex,{sets:(e.sets||[]).length});n.sets=(e.sets||[]).map(s=>isTimed(e)?{w:s.w??null,t:s.t??null,done:false}:{w:s.w,r:s.r,done:false});return n}));break}
  case "open-picker":S.sheet={type:"picker",target:v,q:"",group:"All",creating:false};renderSheet();setTimeout(()=>{const q=$("#pick-q");if(q&&window.matchMedia("(pointer:fine)").matches)q.focus()},30);break;
  case "pick-group":S.sheet.group=v;renderSheet();break;
  case "pick":{const ex=exById(b.dataset.id);if(ex)addPicked(ex);break}
  case "cx-new":S.sheet.creating=true;S.sheet.cxKind="lift";S.sheet.cxName=S.sheet.q;renderSheet();{const n=$("#cx-name");if(n)n.value=S.sheet.q||""}break;
  case "cx-kind":{const n=$("#cx-name");S.sheet.cxName=n?n.value:"";S.sheet.cxKind=v;renderSheet();const n2=$("#cx-name");if(n2)n2.value=S.sheet.cxName||"";break}
  case "cx-cancel":S.sheet.creating=false;renderSheet();break;
  case "cx-save":{const name=($("#cx-name").value||"").trim();if(!name){toast("Give the exercise a name.");break}
    if(allEx().some(e=>e.name.toLowerCase()===name.toLowerCase())){toast("That exercise already exists. Search for it instead.");break}
    const kind=S.sheet.cxKind==="cardio"?"cardio":"lift";const ex={id:"c-"+uid(),name,kind,custom:true,group:kind==="cardio"?"Cardio":($("#cx-grp")||{}).value||"Other"};
    if(kind==="cardio"){ex.indoor="Indoor";ex.incline=true}if(S.sheet.cxKind==="timed")ex.timed=true;S.customEx.push(ex);saveProfile();addPicked(ex);break}
  case "rm-ex":if(hold)stopHold(false);a.entries.splice(ei,1);saveProfile();render();break;
  case "add-set":{const e=a.entries[ei];const l=e.sets[e.sets.length-1]||{};e.sets.push(isTimed(e)?{w:l.w??null,t:l.t??null,done:false}:{w:l.w??null,r:l.r??null,done:false});saveProfile();render();break}
  case "rm-set":a.entries[ei].sets.pop();saveProfile();render();break;
  case "done":{const e=a.entries[ei];const s=e.sets[si];
    if(!s.done){const tm=isTimed(e);const k=tm?"t":"r";const wi=work(e).indexOf(s);const last=lastEntry(e.exId);const ps=!s.wu&&last?work(last.e)[wi]:null;
      if(s[k]==null||s[k]===""){const fill=!tm&&s.tr?s.tr:(ps&&ps[k]);if(fill)s[k]=fill;else{toast(tm?"Enter seconds for this set first.":"Enter reps for this set first.");break}}
      if(s.w==null&&ps&&ps.w)s.w=ps.w;s.done=true;const prt=s.wu?null:checkPR(e,s);s.pr=!!prt;s.prt=prt||null;saveProfile();render();
      if(prt)celebrate(e.name,prt);afterSet(e,s,!!prt)}
    else{s.done=false;s.pr=false;s.prt=null;saveProfile();render()}break}
  case "cmode":a.entries[ei].cardio.mode=v;saveProfile();render();break;
  case "rest-start":startRest();break;
  case "ex-rest":{const e=a.entries[ei];S.restPick=S.restPick===e.uid?null:e.uid;render();break}
  case "ex-rest-set":{const e=a.entries[ei];e.rest=+v;S.exRest=Object.assign({},S.exRest,{[e.exId]:+v});saveProfile();render();toast(`${e.name}: ${clock(+v)} rest`);break}
  case "prog-step":{const e=a.entries[ei];const k=b.dataset.k;const lr=S.lastRange||{min:8,max:12};
    if(!e.prog)e.prog={min:lr.min,max:lr.max,inc:defaultIncKg()};else{e.prog[k]=Math.max(1,Math.min(50,e.prog[k]+(+v)));if(e.prog.min>e.prog.max){if(k==="min")e.prog.max=e.prog.min;else e.prog.min=e.prog.max}}
    S.exProg=Object.assign({},S.exProg,{[e.exId]:Object.assign({},e.prog)});S.lastRange={min:e.prog.min,max:e.prog.max};replan(e);saveProfile();render();break}
  case "prog-incstep":{const e=a.entries[ei];if(!e.prog){const lr=S.lastRange||{min:8,max:12};e.prog={min:lr.min,max:lr.max}}e.prog.inc=stepInc(e.prog.inc||defaultIncKg(),+v);S.exProg=Object.assign({},S.exProg,{[e.exId]:Object.assign({},e.prog)});replan(e);saveProfile();render();break}
  case "prog-inc":{const e=a.entries[ei];if(!e.prog){const lr=S.lastRange||{min:8,max:12};e.prog={min:lr.min,max:lr.max}}e.prog.inc=+v;S.exProg=Object.assign({},S.exProg,{[e.exId]:Object.assign({},e.prog)});replan(e);saveProfile();render();break}
  case "prog-off":{const e=a.entries[ei];e.prog=null;const ep=Object.assign({},S.exProg);delete ep[e.exId];S.exProg=ep;replan(e);saveProfile();render();break}
  case "toggle-wu":{const e=a.entries[ei];const s=e.sets[si];s.wu=!s.wu;if(s.wu){s.pr=false;s.prt=null}saveProfile();render();break}
  case "gen-wu":{const e=a.entries[ei];const ws=work(e);const w0=(ws.find(x=>x.w)||{}).w;if(!w0){toast("Enter your working weight first.");break}
    const g=genWarmups(w0);if(!g.length){toast("That's close to the bar already. Add a set and tap its number to mark it as a warm-up.");break}e.sets=g.concat(e.sets);saveProfile();render();toast(`Added ${g.length} warm-up set${g.length>1?"s":""}`);break}
  case "ss-toggle":{const e=a.entries[ei];e.ss=!e.ss;saveProfile();render();break}
  case "plates":{const e=a.entries[ei];const s=work(e).find(x=>!x.done&&x.w)||work(e).find(x=>x.w)||{};S.sheet={type:"plates",total:s.w?wOut(s.w):"",bar:null};renderSheet();break}
  case "plate-bar":S.sheet.bar=+v;renderSheet();break;
  case "mob-done":a.mobDone=true;saveProfile();render();break;
  case "summary":S.sheet={type:"summary",id:b.dataset.id};renderSheet();break;
  case "share-summary":shareSummary(b.dataset.id);break;
  case "hold":startHold(ei);break;
  case "hold-stop":stopHold(true);break;
  case "hold-cancel":stopHold(false);break;
  case "rest-adj":restEnd+=(+v)*1000;restTotal=Math.max(1,restTotal+(+v));if(restEnd<Date.now())restEnd=Date.now();$("#rest").classList.remove("done");clearTimeout(restI);clearInterval(restI);restI=setInterval(tickRest,250);tickRest();break;
  case "rest-skip":stopRest();break;
  case "finish":finishWorkout();break;
  case "ask":S.confirm=v;render();break;
  case "cancel-confirm":S.confirm=null;render();break;
  case "discard":S.active=null;S.confirm=null;stopRest();stopHold(false);saveProfile(true);render();toast("Workout discarded");break;
  case "del-w":deleteWorkout(b.dataset.id).then(()=>{S.confirm=null;render();toast("Workout deleted")});break;
  case "cal-nav":{const [y,m]=S.calMonth.split("-").map(Number);const d=new Date(y,m+(+v),1);S.calMonth=d.getFullYear()+"-"+d.getMonth();S.calDay=null;render();break}
  case "cal-day":S.calDay=S.calDay===v?null:v;render();break;
  case "cal-clear":S.calDay=null;render();break;
  case "more":S.histLimit+=30;render();break;
  case "metric":S.progMetric=v;render();break;
  case "new-routine":S.rtErr=null;S.routineDraft={id:uid(),name:"",items:[],isNew:true};S.sheet={type:"routine"};renderSheet();break;
  case "edit-routine":{S.rtErr=null;const r=S.routines.find(x=>x.id===b.dataset.id);S.routineDraft=JSON.parse(JSON.stringify(r));S.routineDraft.items.forEach(it=>{if(it.kind!=="cardio"&&!isTimed(it)&&it.repMin==null){it.repMin=it.reps||8;it.repMax=it.reps||8}});S.sheet={type:"routine"};renderSheet();break}
  case "add-template":{const t=TEMPLATES[+v];S.routines.push({id:uid(),name:t.name,items:t.items.map(([id,sets,mn,mx])=>{const ex=exById(id);
    return ex.kind==="cardio"?{exId:id,name:ex.name,kind:ex.kind,sets:1}:{exId:id,name:ex.name,kind:ex.kind,sets,repMin:mn,repMax:mx,reps:mn,inc:defaultIncKg()}})});saveProfile();render();toast(t.name+" added to your routines");break}
  case "rt-step":{const it=S.routineDraft.items[+b.dataset.i];const k=b.dataset.k;
    if(k==="rest"){it.rest=Math.max(15,Math.min(600,(it.rest||restFor(it))+(+v)*15));renderSheet();break}
    if(k==="repMin"||k==="repMax"){it[k]=Math.max(1,Math.min(50,(it[k]||8)+(+v)));if(it.repMin>it.repMax){if(k==="repMin")it.repMax=it.repMin;else it.repMin=it.repMax}it.reps=it.repMin;S.lastRange={min:it.repMin,max:it.repMax};renderSheet();break}
    const tm=k==="reps"&&isTimed(it);it[k]=Math.max(tm?5:1,Math.min(k==="sets"?10:tm?600:50,(it[k]||0)+(+v)*(tm?5:1)));renderSheet();break}
  case "rt-incstep":{const it=S.routineDraft.items[+b.dataset.i];it.inc=stepInc(it.inc||defaultIncKg(),+v);renderSheet();break}
  case "rt-inc":{const it=S.routineDraft.items[+b.dataset.i];const o=INC_OPTS();const cur=it.inc||defaultIncKg();const ix=o.findIndex(x=>Math.abs(x-cur)<1e-6);it.inc=o[(ix+1)%o.length];renderSheet();break}
  case "rt-tog":{const it=S.routineDraft.items[+b.dataset.i];it[b.dataset.k]=!it[b.dataset.k];renderSheet();break}
  case "rt-up":{const i=+b.dataset.i;const it=S.routineDraft.items;[it[i-1],it[i]]=[it[i],it[i-1]];renderSheet();break}
  case "rt-rm":S.routineDraft.items.splice(+b.dataset.i,1);renderSheet();break;
  case "rt-save":{const d=S.routineDraft;const ni=$("#rt-name");if(ni)d.name=ni.value;d.name=(d.name||"").trim();
    const err=!d.name?"Give the routine a name first (at the top of this panel).":!d.items.length?"Add at least one exercise with + Add exercise.":"";
    if(err){S.rtErr=err;renderSheet();const n=$("#rt-name");if(!d.name&&n)n.focus();break}
    S.rtErr=null;
    try{const clean={id:d.id,name:d.name,items:JSON.parse(JSON.stringify(d.items))};clean.items.forEach(it=>{if(it.kind!=="cardio"&&!isTimed(it)&&it.repMin!=null)S.exProg=Object.assign({},S.exProg,{[it.exId]:{min:it.repMin,max:it.repMax,inc:it.inc||defaultIncKg()}})});const i=S.routines.findIndex(r=>r.id===d.id);if(i>=0)S.routines[i]=clean;else S.routines.push(clean);
      S.sheet=null;S.routineDraft=null;saveProfile(true);S.tab="routines";render();toast("Routine saved")}
    catch(e){console.error(e);S.rtErr="Couldn't save the routine ("+(e&&e.message||"unknown error")+"). Reload the page and try again.";renderSheet()}break}
  case "del-r":S.routines=S.routines.filter(r=>r.id!==b.dataset.id);S.confirm=null;saveProfile();render();break;
  }});
function addPicked(ex){const sh=S.sheet;
  if(sh.target==="routine"){S.rtErr=null;const pr=(S.exProg||{})[ex.id]||S.lastRange||{min:8,max:12};S.routineDraft.items.push(ex.kind==="cardio"?{exId:ex.id,name:ex.name,kind:ex.kind,sets:1}:ex.timed?{exId:ex.id,name:ex.name,kind:ex.kind,sets:3,reps:30,timed:true}:{exId:ex.id,name:ex.name,kind:ex.kind,sets:3,repMin:pr.min,repMax:pr.max,reps:pr.min,inc:pr.inc||defaultIncKg()});S.sheet={type:"routine"};renderSheet();return}
  if(!S.active){startWorkout(null,[newEntry(ex)]);S.sheet=null;renderSheet();return}
  S.active.entries.push(newEntry(ex));S.sheet=null;saveProfile();render();
  setTimeout(()=>{const secs=document.querySelectorAll(".ex");const last=secs[secs.length-1];if(last)last.scrollIntoView({behavior:"smooth",block:"center"})},50)}

document.addEventListener("input",ev=>{const t=ev.target;const f=t.dataset.f;if(!f)return;const a=S.active;const ei=t.dataset.ei!=null?+t.dataset.ei:null,si=t.dataset.si!=null?+t.dataset.si:null;
  switch(f){
  case "w":a.entries[ei].sets[si].w=wIn(t.value);saveProfile();break;
  case "r":{const n=parseInt(t.value,10);a.entries[ei].sets[si].r=isNaN(n)?null:n;saveProfile();break}
  case "t":{const n=parseInt(t.value,10);a.entries[ei].sets[si].t=isNaN(n)?null:n;saveProfile();break}
  case "wname":a.name=t.value;saveProfile();break;
  case "wnotes":a.notes=t.value;saveProfile();break;
  case "cdist":a.entries[ei].cardio.dist=dIn(t.value);saveProfile();updPace(ei);break;
  case "cinc":{const n=parseFloat(t.value);a.entries[ei].cardio.incline=isNaN(n)?null:n;saveProfile();break}
  case "ctime":{const s=parseClock(t.value);if(s!=null||t.value===""){a.entries[ei].cardio.time=s;saveProfile();updPace(ei)}break}
  case "rtinc":{const n=wIn(t.value);if(n&&n>0)S.routineDraft.items[+t.dataset.i].inc=n;break}
  case "proginc":{const n=wIn(t.value);if(n&&n>0){const e=a.entries[ei];if(!e.prog){const lr=S.lastRange||{min:8,max:12};e.prog={min:lr.min,max:lr.max}}e.prog.inc=n;S.exProg=Object.assign({},S.exProg,{[e.exId]:Object.assign({},e.prog)});saveProfile()}break}
  case "platew":S.sheet.total=t.value;$("#plate-out").innerHTML=plateOut();break;
  case "pickq":S.sheet.q=t.value;$("#pick-list").innerHTML=pickerList(S.sheet);break;
  case "rtname":{S.routineDraft.name=t.value;if(S.rtErr){S.rtErr=null;const e=$("#rt-err");if(e)e.hidden=true}
    const h=$("#rt-hint");if(h){const msg=!t.value.trim()?"Name the routine to save it.":!S.routineDraft.items.length?"Add at least one exercise to save it.":"";h.textContent=msg;h.hidden=!msg}break}
  }});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="imp-file"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importText(String(r.result||""));r.readAsText(t.files[0]);return}
  const f=t.dataset.f;
  if(f==="ctime"){const ei=+t.dataset.ei;const c=S.active.entries[ei].cardio;t.value=c.time?clock(c.time):""}
  if(f==="rtinc"){renderSheet()}
  if(f==="proginc"){const e=S.active&&S.active.entries[+t.dataset.ei];if(e){replan(e);render()}}
  if(f==="progex"){S.progEx=t.value;S.progMetric=null;render()}});
function updPace(ei){const el=$("#pace-"+ei);if(el)el.innerHTML=paceHTML(S.active.entries[ei].cardio)}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.sheet){S.sheet=null;renderSheet()}});


/* ---------- Backup ---------- */
async function exportBackup(){const data={app:"pump-and-dump",v:1,exportedAt:new Date().toISOString(),profile:profileBody(),workouts:S.workouts};
  const text=JSON.stringify(data);const name=`pump-and-dump-backup-${new Date().toISOString().slice(0,10)}.json`;
  S.lastBackup=new Date().toISOString();saveProfile();
  try{const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Pump & Dump backup"});renderSheet();return}}catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);renderSheet();toast("Backup saved")}
function importText(text){let o;try{o=JSON.parse(text.trim())}catch(e){toast("That isn't a valid backup. Copy the whole text and try again.");return}
  const ws=Array.isArray(o.workouts)?o.workouts:[];const p=o.profile||{};let added=0;
  ws.forEach(w=>{if(!w||!w.id||!w.date)return;w=JSON.parse(JSON.stringify(w));if(!S.workouts.some(x=>x.id===w.id))added++;
    S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(w);delete outbox.del[w.id];outbox.up[w.id]=w});
  (p.customEx||[]).forEach(e=>{if(e&&e.id&&!S.customEx.some(x=>x.id===e.id))S.customEx.push(JSON.parse(JSON.stringify(e)))});
  let rAdded=0;(p.routines||[]).forEach(r=>{if(r&&r.id&&!S.routines.some(x=>x.id===r.id)){S.routines.push(JSON.parse(JSON.stringify(r)));rAdded++}});
  S.importOpen=false;saveProfile(true);render();toast(`Imported ${added} workout${added===1?"":"s"} and ${rAdded} routine${rAdded===1?"":"s"}`)}

let toastT=null;function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2600)}

boot();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
